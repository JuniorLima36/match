<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
    <title>Quer ir a um date comigo? 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        body {
            background-color: #d9381e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            color: rgba(0, 0, 0, 0.4);
            font-size: 24px;
            animation: flyHeart 6s infinite linear;
        }

        @keyframes flyHeart {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .step {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.4s ease-in-out;
        }

        .step.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .card {
            background-color: #5c180e;
            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            border: 2px solid #7d2416;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #ffccd5;
        }

        p {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #ffccd5;
        }

        .label-input {
            display: block;
            text-align: left;
            font-size: 0.9rem;
            color: #ffccd5;
            margin-bottom: 5px;
            margin-left: 5px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 50px;
        }

        .btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: #ff3333;
        }

        #btn-nao {
            background-color: #8c2614;
            position: relative;
            transition: 0.15s ease-out;
            white-space: nowrap;
            width: auto;
        }

        input[type="date"], input[type="time"] {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            border: 2px solid #7d2416;
            background-color: #421009;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            cursor: pointer;
        }

        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            padding: 5px;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-card {
            position: relative;
            background-size: cover;
            background-position: center;
            border: 2px solid #7d2416;
            border-radius: 15px;
            height: 95px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .option-card span {
            position: relative;
            z-index: 2;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            padding-bottom: 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            width: 100%;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 40%, transparent 100%);
            padding-top: 15px;
        }

        .option-card:hover {
            transform: scale(1.03);
            border-color: #ffccd5;
        }

        .option-card.selected {
            border-color: #ff4d4d;
            box-shadow: 0 0 12px #ff4d4d;
            transform: scale(1.05);
        }

        .summary-box {
            text-align: left;
            background-color: #421009;
            border: 2px solid #7d2416;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #ffccd5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="hearts-container"></div>

    <div class="main-container">
        
        <!-- ETAPA 1 -->
        <div class="step active" id="step-1">
            <div style="font-size: 80px; margin-bottom: 15px;">🥺</div>
            <div class="card">
                <h2>VOCÊ ACEITARIA IR A UM DATE COMIGO?</h2>
                <div class="btn-group">
                    <button class="btn" style="width: auto;" onclick="proximaEtapa(2)">SIM</button>
                    <button class="btn" id="btn-nao" onmouseover="fugir()" ontouchstart="fugir()">NÃO</button>
                </div>
            </div>
        </div>

        <!-- ETAPA 2 -->
        <div class="step" id="step-2">
            <div style="font-size: 80px; margin-bottom: 15px;">😏🌹</div>
            <div class="card">
                <h2>VOCÊ DISSE SIM? 🥺</h2>
                <p>Eu estava esperando você dizer não kkkk</p>
                <button class="btn" onclick="proximaEtapa(3)">PRÓXIMO 💙</button>
            </div>
        </div>

        <!-- ETAPA 3 -->
        <div class="step" id="step-3">
            <div class="card">
                <h2>📅 QUANDO VOCÊ TÁ LIVRE?</h2>
                
                <label class="label-input">Escolhe a data</label>
                <input type="date" id="input-data" onchange="verificarCamposData()" onclick="this.showPicker && this.showPicker()">

                <label class="label-input">Escolhe o horário</label>
                <input type="time" id="input-hora" value="18:00" onchange="verificarCamposData()" onclick="this.showPicker && this.showPicker()">

                <button class="btn" id="btn-proximo-data" style="opacity: 0.5; pointer-events: none;" onclick="salvarDataEAvancar()">SELECIONAR A DATA 💙</button>
            </div>
        </div>

        <!-- ETAPA 4 -->
        <div class="step" id="step-4">
            <div class="card">
                <h2>O QUE TÁ AFIM? 😏</h2>
                <div class="grid-options" id="grid-comidas"></div>
                <button class="btn" id="btn-comida" style="opacity: 0.5; pointer-events: none;" onclick="salvarComidaEAvancar()">ESCOLHE PRIMEIRO 👇</button>
            </div>
        </div>

        <!-- ETAPA 5 -->
        <div class="step" id="step-5">
            <div class="card">
                <h2>QUAL É A VIBE? 🎨</h2>
                <div class="grid-options" id="grid-vibes"></div>
                <button class="btn" id="btn-vibe" style="opacity: 0.5; pointer-events: none;" onclick="salvarVibeEAvancar()">ESCOLHE PRIMEIRO 👇</button>
            </div>
        </div>

        <!-- ETAPA 6 -->
        <div class="step" id="step-6">
            <div style="margin-bottom: 5px;">
                <div style="font-size: 55px; background-color: #5c180e; width: 85px; height: 85px; display: flex; align-items: center; justify-content: center; margin: 0 auto; border-radius: 50%; border: 2px solid #7d2416; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">😈</div>
            </div>
            <div class="card">
                <h2>TÔ CONTIGO, GATINHA. 💙</h2>
                <p style="font-size: 0.95rem; margin-bottom: 15px;">Fica pronta que eu vou te buscar 🚗</p>
                
                <div class="summary-box">
                    <div>📅 <span id="resumo-data">29 de agosto de 2026</span></div>
                    <div>⏰ <span id="resumo-hora">18:00</span></div>
                    <div>🍽️ <span id="resumo-comida">Massas</span></div>
                    <div>🎨 <span id="resumo-vibe">Cinema</span></div>
                </div>

                <button class="btn" style="background-color: #25D366;" onclick="enviarWhatsApp()">MANDAR NO WHATSAPP 💚</button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = "https://6a91357d7751d35ce47e4896.mockapi.io/match/preferences";
        
        let numeroConfigurado = "5511999999999";
        let listaComidas = ['Hambúrguer', 'Sushi', 'Massas', 'Tacos', 'Pizza'];
        let listaVibes = ['Golfe', 'Caminhada', 'Cinema', 'Dança', 'Parque', 'Praia'];

        // Dicionário de fotos muito mais completo para evitar repetições
        const fotosComidaMap = {
            'hambúrguer': 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80',
            'hamburguer': 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80',
            'sushi': 'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=400&q=80',
            'massas': 'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=400&q=80',
            'massa': 'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=400&q=80',
            'pasta': 'https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=400&q=80',
            'tacos': 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=400&q=80',
            'taco': 'https://images.unsplash.com/photo-1565299585323-38d6b0865b47?auto=format&fit=crop&w=400&q=80',
            'pizza': 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=400&q=80',
            'dogao': 'https://images.unsplash.com/photo-1619740455993-9e612b1af08a?auto=format&fit=crop&w=400&q=80',
            'cachorro quente': 'https://images.unsplash.com/photo-1619740455993-9e612b1af08a?auto=format&fit=crop&w=400&q=80',
            'bk': 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=400&q=80',
            'burger king': 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=400&q=80',
            'mc donalds': 'https://images.unsplash.com/photo-1610440042657-612c34d95e9f?auto=format&fit=crop&w=400&q=80',
            'mcdonalds': 'https://images.unsplash.com/photo-1610440042657-612c34d95e9f?auto=format&fit=crop&w=400&q=80',
            'churrasco': 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=400&q=80',
            'comida japonesa': 'https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=400&q=80'
        };

        const fotosVibeMap = {
            'golfe': 'https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=400&q=80',
            'caminhada': 'https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=400&q=80',
            'cinema': 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=400&q=80',
            'dança': 'https://images.unsplash.com/photo-1545128485-c400e7702796?auto=format&fit=crop&w=400&q=80',
            'danca': 'https://images.unsplash.com/photo-1545128485-c400e7702796?auto=format&fit=crop&w=400&q=80',
            'parque': 'https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?auto=format&fit=crop&w=400&q=80',
            'praia': 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=80',
            'role gotico': 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=400&q=80',
            'gótico': 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=400&q=80',
            'suruba': 'https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=400&q=80',
            'festa': 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=400&q=80',
            'tecnologia': 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80',
            'tecnô': 'https://images.unsplash.com/photo-1574391884720-bbc3740c59d1?auto=format&fit=crop&w=400&q=80',
            'tecno': 'https://images.unsplash.com/photo-1574391884720-bbc3740c59d1?auto=format&fit=crop&w=400&q=80',
            'balada': 'https://images.unsplash.com/photo-1566737236500-c8ac43014a67?auto=format&fit=crop&w=400&q=80'
        };

        // Lista diversificada de fallback caso insira algo que não esteja mapeado
        const fotosGenericas = [
            'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=400&q=80',
            'https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=400&q=80'
        ];

        function obterFotoCard(nomeItem, tipo) {
            const chave = nomeItem.toLowerCase().trim();
            if (tipo === 'comida' && fotosComidaMap[chave]) {
                return fotosComidaMap[chave];
            }
            if (tipo === 'vibe' && fotosVibeMap[chave]) {
                return fotosVibeMap[chave];
            }
            // Usa o código hash do texto para escolher de forma consistente uma foto diferente da lista genérica
            const indexHash = chave.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return fotosGenericas[indexHash % fotosGenericas.length];
        }
        window.addEventListener('DOMContentLoaded', async () => {
            const hoje = new Date().toISOString().split('T')[0];
            const inputData = document.getElementById('input-data');
            if (inputData) inputData.min = hoje;

            const urlParams = new URLSearchParams(window.location.search);
            const idConfig = urlParams.get('id');

            if (idConfig) {
                try {
                    const response = await fetch(`${API_URL}/${idConfig}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data.phone) numeroConfigurado = data.phone;
                        if (data.foods && data.foods.length > 0) listaComidas = data.foods;
                        if (data.vibes && data.vibes.length > 0) listaVibes = data.vibes;
                    }
                } catch (error) {
                    console.error("Erro ao buscar dados da API:", error);
                }
            }

            const gridComidas = document.getElementById('grid-comidas');
            gridComidas.innerHTML = '';
            listaComidas.forEach(comida => {
                const urlFoto = obterFotoCard(comida, 'comida');
                const card = document.createElement('div');
                card.className = 'option-card';
                card.style.backgroundImage = `url('${urlFoto}')`;
                card.setAttribute('onclick', `selecionarComida(this, '${comida}')`);
                card.innerHTML = `<span>${comida}</span>`;
                gridComidas.appendChild(card);
            });

            const gridVibes = document.getElementById('grid-vibes');
            gridVibes.innerHTML = '';
            listaVibes.forEach(vibe => {
                const urlFoto = obterFotoCard(vibe, 'vibe');
                const card = document.createElement('div');
                card.className = 'option-card';
                card.style.backgroundImage = `url('${urlFoto}')`;
                card.setAttribute('onclick', `selecionarVibe(this, '${vibe}')`);
                card.innerHTML = `<span>${vibe}</span>`;
                gridVibes.appendChild(card);
            });
        });

        const frasesNao = ["NÃO", "TEM CERTEZA?", "PENSA BEM", "SÉRIO?", "PENSE NOVAMENTE", "NÃO FAZ ISSO", "ERRADO!", "TENTA O OUTRO"];
        let indiceFrase = 0;
        let dataEscolhida = "", horaEscolhida = "", comidaEscolhida = "", vibeEscolhida = "";

        function criarCoracao() {
            const container = document.getElementById('hearts-container');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(criarCoracao, 400);

        function proximaEtapa(numeroEtapa) {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            document.getElementById(`step-${numeroEtapa}`).classList.add('active');
        }

        function fugir() {
            const btnNao = document.getElementById('btn-nao');
            if (btnNao.style.position !== 'fixed') btnNao.style.position = 'fixed';
            indiceFrase = (indiceFrase + 1) % frasesNao.length;
            btnNao.innerText = frasesNao[indiceFrase];
            const larguraMax = window.innerWidth - btnNao.offsetWidth - 40;
            const alturaMax = window.innerHeight - btnNao.offsetHeight - 40;
            btnNao.style.left = `${Math.max(20, Math.floor(Math.random() * larguraMax))}px`;
            btnNao.style.top = `${Math.max(20, Math.floor(Math.random() * alturaMax))}px`;
        }

        function verificarCamposData() {
            const dataInput = document.getElementById('input-data').value;
            const horaInput = document.getElementById('input-hora').value;
            const btnProximo = document.getElementById('btn-proximo-data');
            const agora = new Date();
            const dataSelecionadaObj = new Date(dataInput + 'T' + (horaInput || '00:00'));

            if (dataInput && dataSelecionadaObj < agora) {
                alert('Você não pode selecionar uma data ou horário que já passou!');
                document.getElementById('input-hora').value = '';
                btnProximo.style.opacity = '0.5';
                btnProximo.style.pointerEvents = 'none';
                return;
            }

            if (dataInput && horaInput) {
                btnProximo.style.opacity = '1';
                btnProximo.style.pointerEvents = 'auto';
            } else {
                btnProximo.style.opacity = '0.5';
                btnProximo.style.pointerEvents = 'none';
            }
        }

        function salvarDataEAvancar() {
            const dataInput = document.getElementById('input-data').value;
            const horaInput = document.getElementById('input-hora').value;
            if (!dataInput || !horaInput) return;

            dataEscolhida = dataInput;
            horaEscolhida = horaInput;

            const [ano, mes, dia] = dataEscolhida.split('-');
            const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
            document.getElementById('resumo-data').innerText = `${dia} de ${meses[parseInt(mes) - 1]} de ${ano}`;
            document.getElementById('resumo-hora').innerText = horaEscolhida;
            proximaEtapa(4);
        }

        function selecionarComida(elemento, comida) {
            elemento.closest('.step').querySelectorAll('.option-card').forEach(opt => opt.classList.remove('selected'));
            elemento.classList.add('selected');
            comidaEscolhida = comida;
            const btnComida = document.getElementById('btn-comida');
            btnComida.innerText = `CONFIRMAR ${comida.toUpperCase()} 💙`;
            btnComida.style.opacity = '1';
            btnComida.style.pointerEvents = 'auto';
        }

        function salvarComidaEAvancar() {
            if (!comidaEscolhida) return;
            document.getElementById('resumo-comida').innerText = comidaEscolhida;
            proximaEtapa(5);
        }

        function selecionarVibe(elemento, vibe) {
            elemento.closest('.step').querySelectorAll('.option-card').forEach(opt => opt.classList.remove('selected'));
            elemento.classList.add('selected');
            vibeEscolhida = vibe;
            const btnVibe = document.getElementById('btn-vibe');
            btnVibe.innerText = `CONFIRMAR ${vibe.toUpperCase()} 💙`;
            btnVibe.style.opacity = '1';
            btnVibe.style.pointerEvents = 'auto';
        }

        function salvarVibeEAvancar() {
            if (!vibeEscolhida) return;
            document.getElementById('resumo-vibe').innerText = vibeEscolhida;
            proximaEtapa(6);
        }

        function enviarWhatsApp() {
            const texto = `Oie! Aceitei o date sim! S2\n\nFicou marcado:\n- Data: ${document.getElementById('resumo-data').innerText}\n- Horario: ${document.getElementById('resumo-hora').innerText}\n- Comida: ${document.getElementById('resumo-comida').innerText}\n- Vibe: ${document.getElementById('resumo-vibe').innerText}\n\nJa pode ir me buscar!`;
            window.open(`https://wa.me/${numeroConfigurado}?text=${encodeURIComponent(texto)}`, '_blank');
        }
    </script>
</body>
</html>
